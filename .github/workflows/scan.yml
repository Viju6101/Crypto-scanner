name: scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore signal history (for cooldowns)
        uses: actions/cache@v4
        with:
          path: signals.db
          key: signals-${{ github.run_id }}
          restore-keys: signals-

      - name: Run scanner
        run: python scanner.py
        env:
          ONCE: "1"
          EXCHANGE: okx
          TOP_N: "300"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
